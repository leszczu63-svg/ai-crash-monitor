name: Komenda

on:
  workflow_dispatch:
    inputs:
      komenda:
        description: "np. status | kandydaci | potwierdz ID | odrzuc ID | dodaj bankrupt 2027-01-15 | usun acquired 2027-01-15 | h100 0.95"
        required: true
        default: status

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KOMENDA: ${{ inputs.komenda }}
        run: python monitor.py cmd "$KOMENDA"
      - name: Zapisz stan
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json
          git diff --cached --quiet || (git commit -m "Aktualizacja danych" && git pull --rebase && git push)
